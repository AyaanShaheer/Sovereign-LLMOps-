apiVersion: v1
kind: Namespace
metadata:
  name: sovereign-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-edge-llm
  namespace: sovereign-ai
  labels:
    app: qwen-edge-llm
    version: v1-q4km
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen-edge-llm
  template:
    metadata:
      labels:
        app: qwen-edge-llm
        version: v1-q4km
    spec:
      containers:
      - name: llama-server
        image: localhost:30500/llama-server:v1
        imagePullPolicy: IfNotPresent
        args:
        - "-m"
        - "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8080"
        - "--ctx-size"
        - "2048"
        - "--threads"
        - "4"
        - "--metrics"
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            memory: "1200Mi"
            cpu: "1000m"
          limits:
            memory: "2200Mi"
            cpu: "3500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: model-volume
          mountPath: /models
          readOnly: true
      volumes:
      - name: model-volume
        hostPath:
          path: /opt/sovereign-models
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-edge-llm
  namespace: sovereign-ai
  labels:
    app: qwen-edge-llm
spec:
  type: NodePort
  selector:
    app: qwen-edge-llm
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30800

